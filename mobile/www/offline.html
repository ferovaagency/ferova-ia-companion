<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lee con Koa</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14122b; color: #ece8ff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: #b9b3d9; max-width: 22rem; line-height: 1.5; margin: 0 auto; }
    button { margin-top: 24px; background: #b8a6ff; color: #14122b; border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 700; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <div style="font-size:3rem" aria-hidden="true">📚</div>
    <h1>Sin conexión</h1>
    <p>Koa necesita internet para traer tu biblioteca. Revisa tu conexión y vuelve a intentarlo.</p>
    <button type="button" onclick="location.href='https://librero-ia.ferova.com.co/'">Reintentar</button>
  </main>
</body>
</html>
